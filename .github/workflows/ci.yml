name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push on the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs the toolchain declared in rust-toolchain.toml (version + components).
      - name: Install toolchain
        run: rustup toolchain install

      # Caches ~/.cargo and target/, keyed on Cargo.lock and the toolchain.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Also installs the wasm32-unknown-unknown target listed in rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Prebuilt wasm-pack binary (much faster than `cargo install wasm-pack`).
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build
        run: wasm-pack build crates/crochet-wasm --target web --out-dir ../../web/src/wasm

      - name: Check output
        run: |
          test -f web/src/wasm/crochet_wasm_bg.wasm
          test -f web/src/wasm/crochet_wasm.js
