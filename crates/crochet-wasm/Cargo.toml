[package]
name = "crochet-wasm"
edition.workspace = true
version.workspace = true

# Two build outputs for the same crate:
# - "cdylib": a C-style dynamic library, the format wasm-pack turns into a .wasm
#   module (think "native DLL", not a .NET assembly: no metadata, only exported symbols).
# - "rlib": the regular Rust library format, so `cargo test` and other crates can still use it.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crochet-mesh = { path = "../crochet-mesh" }
wasm-bindgen = "0.2.129"

[dev-dependencies]
test-case.workspace = true
